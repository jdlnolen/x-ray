<!doctype html>
<meta charset="utf-8">
<title>X-ray browser verification</title>
<h1>X-ray browser verification</h1>
<ol id="results"></ol>
<iframe title="X-ray under test" style="width:1280px;height:900px;border:0" src="../index.html"></iframe>
<script>
const frame = document.querySelector('iframe');
const results = document.querySelector('#results');
const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
function check(name, condition) {
  const item = document.createElement('li');
  item.textContent = `${condition ? 'PASS' : 'FAIL'}: ${name}`;
  results.append(item);
  if (!condition) throw new Error(name);
}
frame.addEventListener('load', async () => {
  try {
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const figure = doc.querySelector('[data-diagram]');
    const viewport = doc.querySelector('.viewport');
    const layout = doc.querySelector('[data-layout-choice]');
    const focus = doc.querySelector('[data-focus-node]');
    const action = name => doc.querySelector(`[data-action="${name}"]`).click();
    const camera = () => doc.querySelector(`[data-layout="${figure.dataset.orientation}"] svg`).getAttribute('viewBox');
    const cameraWidth = () => Number(camera().split(' ')[2]);
    const change = (select, value) => { select.value = value; select.dispatchEvent(new win.Event('change')); };
    const pointer = (type, id, x, y, target = viewport) => target.dispatchEvent(new win.PointerEvent(type, {
      bubbles: true, cancelable: true, pointerId: id, pointerType: 'touch', clientX: x, clientY: y, button: 0,
    }));
    // Synthetic pointers have no platform capture. Keep capture-only calls inert
    // while the browser runs the real gesture handlers and SVG camera math.
    viewport.setPointerCapture = () => {};
    viewport.hasPointerCapture = () => false;
    await nextFrame();
    check('Desktop auto layout is horizontal', figure.dataset.orientation === 'horizontal');
    check('Desktop page has no horizontal overflow', doc.documentElement.scrollWidth === win.innerWidth);
    const fitted = camera();
    action('in');
    check('Zoom changes the camera', camera() !== fitted);
    action('fit');
    check('Fit restores the complete view', camera() === fitted);
    const linkedNode = doc.querySelector('[data-layout="horizontal"] .node a').closest('.node');
    change(focus, linkedNode.querySelector('title').textContent);
    const nodeBox = doc.querySelector('.node.focused').getBoundingClientRect();
    const viewBox = viewport.getBoundingClientRect();
    check('Focus keeps the entire selected component in view', nodeBox.left >= viewBox.left && nodeBox.right <= viewBox.right &&
      nodeBox.top >= viewBox.top && nodeBox.bottom <= viewBox.bottom);
    viewport.dispatchEvent(new win.KeyboardEvent('keydown', {key: '0', bubbles: true}));
    check('Keyboard reset clears focus and restores fit', !doc.querySelector('.focused') && camera() === fitted);
    const start = camera();
    pointer('pointerdown', 1, 100, 100);
    pointer('pointermove', 1, 130, 100);
    const afterFirstMove = camera();
    pointer('lostpointercapture', 1, 130, 100, linkedNode);
    pointer('pointermove', 1, 160, 100);
    check('Touch pan survives capture transfer from a node', camera() !== afterFirstMove && afterFirstMove !== start);
    pointer('pointerup', 1, 160, 100);
    let keyboardClickReachedLink = false;
    const link = linkedNode.querySelector('a');
    link.addEventListener('click', event => { keyboardClickReachedLink = true; event.preventDefault(); }, {once: true});
    link.dispatchEvent(new win.MouseEvent('click', {bubbles: true, cancelable: true, detail: 0}));
    check('Keyboard link activation survives a previous drag', keyboardClickReachedLink);
    link.focus();
    check('Keyboard focus reveals its linked component', doc.querySelector('.node.focused') === linkedNode);
    const focusedCamera = camera();
    link.dispatchEvent(new win.KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true}));
    check('Keyboard panning works from a node link', camera() !== focusedCamera);
    action('fit');
    const fittedWidth = cameraWidth();
    pointer('pointerdown', 1, 100, 100);
    pointer('pointerdown', 2, 200, 100);
    pointer('pointermove', 2, 250, 100);
    const pinched = camera();
    check('Two-pointer pinch zooms the graph', cameraWidth() < fittedWidth);
    pointer('pointerup', 2, 250, 100);
    pointer('pointermove', 1, 130, 100);
    check('Remaining finger continues panning after pinch', camera() !== pinched);
    pointer('pointercancel', 1, 130, 100);
    const cancelled = camera();
    pointer('pointermove', 1, 160, 100);
    check('Cancelled pointers stop moving the camera', camera() === cancelled);
    action('fit');
    action('expand');
    check('Expanded view uses a modal dialog', !!doc.querySelector('dialog[open]'));
    doc.querySelector('dialog').close();
    await nextFrame();
    check('Closing restores the diagram and trigger focus', !doc.querySelector('dialog') &&
      doc.activeElement === doc.querySelector('[data-action="expand"]'));
    action('in');
    const beforePrint = camera();
    win.dispatchEvent(new win.Event('beforeprint'));
    check('Print restores the whole graph', camera() !== beforePrint);
    win.dispatchEvent(new win.Event('afterprint'));
    check('Returning from print restores the camera', camera() === beforePrint);
    frame.style.width = '390px'; frame.style.height = '844px';
    await nextFrame();
    check('Phone auto layout is vertical', figure.dataset.orientation === 'vertical');
    check('Phone page has no horizontal overflow', doc.documentElement.scrollWidth === win.innerWidth);
    check('Inline touch gestures permit vertical page scrolling', win.getComputedStyle(viewport).touchAction === 'pan-y');
    change(layout, 'horizontal');
    check('Phone can override the graph direction', figure.dataset.orientation === 'horizontal');
    change(layout, 'auto');
    change(focus, focus.options[1].value);
    frame.style.width = '1280px';
    await nextFrame();
    check('Resizing preserves the focused component in the new orientation', figure.dataset.orientation === 'horizontal' &&
      doc.querySelector('.node.focused title').textContent === focus.value);
    check('Every step is available in top-level navigation', doc.querySelector('[data-page-nav]').options.length ===
      doc.querySelectorAll('.steps .step').length + 1);
    const navigation = doc.querySelector('[data-page-nav]');
    navigation.selectedIndex = 1;
    win.dispatchEvent(new win.Event('pageshow'));
    check('Returning with Back restores the navigation selection', navigation.selectedIndex === 0);
    frame.style.width = '844px'; frame.style.height = '390px';
    await nextFrame();
    check('Short landscape screens keep a compact diagram and a scrolling header', viewport.clientHeight < 390 * .65 &&
      win.getComputedStyle(doc.querySelector('.topnav')).position === 'static');
    document.title = 'PASS — X-ray browser verification';
  } catch (error) {
    const item = document.createElement('li'); item.textContent = `ERROR: ${error.message}`; results.append(item);
    document.title = 'FAIL — X-ray browser verification';
  }
}, {once: true});
</script>
